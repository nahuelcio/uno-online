<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNO Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e8433f; --green:#3faa54; --blue:#3d7be0; --yellow:#f2c31a;
  --felt:#0d5c3f; --felt-2:#083f2b;
  --ink:#f6f7fb; --muted:#a9b6c4; --panel:#131924; --line:#26303f;
  --card-w:78px; --card-h:116px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; color:var(--ink); font-family:Outfit,system-ui,sans-serif;
  background:radial-gradient(120% 110% at 50% 8%, var(--felt) 0%, var(--felt-2) 55%, #04211a 100%);
  min-height:100dvh; display:flex; flex-direction:column; overflow-x:hidden;
}
h1{font-family:Bungee,Impact,sans-serif; margin:0; font-size:2.6rem; letter-spacing:.04em;
   text-shadow:0 3px 0 #0006, 0 0 26px #f2c31a55}

/* ---------- lobby ---------- */
#lobby{margin:auto; text-align:center; padding:2rem 1.2rem; animation:pop .35s ease both}
.panel{background:#0b1220cc; backdrop-filter:blur(8px); border:1px solid var(--line);
  border-radius:20px; padding:1.6rem; box-shadow:0 24px 60px #0007; max-width:420px}
input{width:100%; margin:.4rem 0 .9rem; padding:.7rem .9rem; border-radius:12px; font:inherit;
  background:#0f1622; color:var(--ink); border:1px solid var(--line)}
input:focus{outline:2px solid var(--yellow); outline-offset:1px}
label{display:block; text-align:left; font-size:.82rem; color:var(--muted); letter-spacing:.06em; text-transform:uppercase}
button{font:600 1rem Outfit,sans-serif; cursor:pointer; border:0; border-radius:12px;
  padding:.75rem 1.3rem; color:#08131f; background:linear-gradient(180deg,#ffd94a,#f2b60d);
  box-shadow:0 6px 0 #b8860b, 0 12px 24px #0006; transition:transform .08s, box-shadow .08s}
button:active:not(:disabled){transform:translateY(4px); box-shadow:0 2px 0 #b8860b}
button:disabled{opacity:.45; cursor:not-allowed; box-shadow:none}
button.ghost{background:#1b2534; color:var(--ink); box-shadow:0 5px 0 #0d131d}

/* ---------- table ---------- */
#game{display:none; flex:1; flex-direction:column; gap:.6rem; padding:.9rem clamp(.6rem,3vw,2rem) 1.2rem}
.topbar{display:flex; align-items:center; gap:.8rem; flex-wrap:wrap}
.topbar h1{font-size:1.5rem}
.chip{background:#0b1220aa; border:1px solid var(--line); border-radius:999px; padding:.3rem .8rem; font-size:.85rem; color:var(--muted)}
.seats{pointer-events:none}
.felt,.seats{position:absolute; left:50%; top:50%; translate:-50% -50%;
  width:min(92%,720px); aspect-ratio:1.9; max-height:100%}
.seats .seat{position:absolute; left:calc(50% + var(--x)*1%); top:calc(50% + var(--y)*1%);
  translate:-50% -50%; pointer-events:auto}
/* ponytail: before the game starts there is no turn order, so seats list plainly instead of orbiting */
.seats.lobby{position:static; translate:none; width:auto; max-height:none; aspect-ratio:auto;
  display:flex; flex-wrap:wrap; gap:.6rem; justify-content:center}
.seats.lobby .seat{position:relative; left:auto; top:auto; translate:none}
.seats.lobby .order{display:none}
.seats .seat.active{translate:-50% -50%; transform:scale(1.1)}
.seat .order{position:absolute; bottom:-9px; left:-9px; width:20px; height:20px; border-radius:50%;
  background:#16203b; border:1px solid var(--line); color:var(--muted);
  font-size:.62rem; font-weight:800; display:grid; place-items:center}
.seat.next .order{background:var(--yellow); color:#111; border-color:transparent}
.felt{border-radius:50%; background:radial-gradient(ellipse at 50% 40%,#1c6b45,#0d4429 70%,#0a3521);
  border:10px solid #2a1a10; box-shadow:inset 0 0 60px #0009, 0 20px 50px #0006; pointer-events:none}
.seat{position:relative; background:#0b1220bb; border:1px solid var(--line); border-radius:14px;
  padding:.5rem .8rem; min-width:104px; text-align:center; transition:.25s}
.seat b{display:block; font-size:.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:11ch}
.seat small{color:var(--muted)}
.seat.active{border-color:var(--yellow); background:#f2c31a22; transform:translateY(-6px) scale(1.06);
  animation:turnpulse 1.4s ease-in-out infinite}
.seat.active b{color:var(--yellow)}
.seat.active::before{content:"\25B6 TURN"; position:absolute; top:-11px; left:50%; translate:-50% 0;
  background:var(--yellow); color:#111; font-size:.6rem; font-weight:900; letter-spacing:.08em;
  padding:2px 7px; border-radius:99px; white-space:nowrap}
@keyframes turnpulse{50%{box-shadow:0 0 0 5px #f2c31a33, 0 0 34px #f2c31a66}
  0%,100%{box-shadow:0 0 0 2px #f2c31a88, 0 0 18px #f2c31a55}}
.seat.me b{color:var(--yellow)}
.seat .uno{position:absolute; top:-9px; right:-9px; background:var(--red); color:#fff;
  font-family:Bungee,sans-serif; font-size:.6rem; padding:.15rem .4rem; border-radius:6px; animation:pulse 1s infinite}

.center{flex:1; min-height:min(46vh,340px); margin:1.4rem 0 2.6rem; display:flex; align-items:center; justify-content:center; gap:clamp(1rem,5vw,3.5rem); flex-wrap:wrap; position:relative}
.stackzone{display:flex; flex-direction:column; align-items:center; gap:.5rem}
.stackzone small{color:var(--muted); letter-spacing:.14em; font-size:.7rem; text-transform:uppercase}
.deck{position:relative; width:var(--card-w); height:var(--card-h); border-radius:12px; cursor:pointer;
  background:repeating-linear-gradient(135deg,#1b1f2b 0 8px,#141824 8px 16px); border:3px solid #fff2;
  display:grid; place-items:center; font-family:Bungee,sans-serif; color:#fff6; transition:transform .12s}
.deck:hover{transform:translateY(-6px) rotate(-2deg)}
.deck.disabled{opacity:.55; cursor:not-allowed}
.deck.disabled:hover{transform:none}
.deck.mustdraw{border-color:var(--yellow); color:var(--yellow); animation:deckcall 1.1s ease-in-out infinite}
.deck.mustdraw::after{content:"\2B06 TAP TO DRAW"; position:absolute; left:50%; bottom:-30px; translate:-50% 0;
  background:var(--yellow); color:#111; font-family:inherit; font-size:.65rem; font-weight:900;
  letter-spacing:.08em; padding:3px 9px; border-radius:99px; white-space:nowrap}
@keyframes deckcall{0%,100%{box-shadow:0 0 0 2px #f2c31a66, 0 0 16px #f2c31a44; transform:translateY(0)}
  50%{box-shadow:0 0 0 6px #f2c31a33, 0 0 34px #f2c31a77; transform:translateY(-7px)}}
.colorlight{min-width:var(--card-w); padding:.2rem .6rem; border-radius:999px; transition:background .4s;
  font:800 .72rem Outfit,sans-serif; letter-spacing:.12em; color:#0c1a12; text-align:center;
  box-shadow:0 0 18px #0004, 0 0 0 2px #ffffff22}

/* cards */
.card{
  width:var(--card-w); height:var(--card-h); border-radius:12px; position:relative;
  display:grid; place-items:center; color:#fff; font-family:Bungee,sans-serif; font-size:1.5rem;
  border:4px solid #fff; box-shadow:0 8px 18px #0007; user-select:none; overflow:hidden;
  background:var(--c,#333);
}
.card::before{content:""; position:absolute; inset:9%; border-radius:50%/38%;
  background:#ffffff2e; transform:rotate(-22deg)}
.card span{position:relative; text-shadow:0 3px 0 #0005}
.card .corner{position:absolute; font-size:.62rem; opacity:.95}
.card .corner.tl{top:4px; left:6px}
.card .corner.br{bottom:4px; right:6px; transform:rotate(180deg)}
.R{--c:linear-gradient(160deg,#f2605c,#c9302c)}
.G{--c:linear-gradient(160deg,#57c26d,#2c8341)}
.B{--c:linear-gradient(160deg,#5a95ea,#2a5cb0)}
.Y{--c:linear-gradient(160deg,#ffd75e,#d8a406); color:#40320a}
.Y span{text-shadow:0 3px 0 #fff6}
.W{--c:conic-gradient(from 45deg,#e8433f 0 25%,#f2c31a 0 50%,#3faa54 0 75%,#3d7be0 0)}

#pile{position:relative; width:var(--card-w); height:var(--card-h)}
#pile .card{position:absolute; inset:0}
#pile .card.fresh{animation:slam .34s cubic-bezier(.2,1.5,.4,1) both}

/* hand */
.handwrap{display:flex; justify-content:center; align-items:flex-end; min-height:calc(var(--card-h) + 30px); padding-top:8px}
#hand{display:flex; justify-content:center; padding-inline:1rem; max-width:100%; overflow-x:auto; scrollbar-width:none}
#hand::-webkit-scrollbar{display:none}
#hand .card{flex:0 0 auto; margin-left:-22px; cursor:pointer;
  transition:transform .16s ease, filter .16s ease}
#hand .card:first-child{margin-left:0}
#hand .card:hover{transform:translateY(-18px) scale(1.05); z-index:5}
#hand .card.dead{filter:saturate(.85) brightness(.88); cursor:not-allowed}
#hand .card.dead::before{content:""; position:absolute; inset:0; border-radius:inherit; background:#05101a2e}
#hand .card.dead::after{content:"\1F512"; position:absolute; inset:0; display:grid; place-items:center;
  font-size:1.7rem; line-height:1; text-shadow:none; filter:drop-shadow(0 2px 4px #000a)}
#hand .card.dead:hover{transform:none; filter:none}
#hand.waiting .card{cursor:default}
#hand.mine .card:not(.dead){box-shadow:0 0 0 3px #f2c31a88, 0 10px 22px #0008}

.controls{display:flex; gap:.7rem; justify-content:center; align-items:center; flex-wrap:wrap}
.chip.turnchip{font-size:1rem; font-weight:800; padding:.5rem .9rem}
.chip.turnchip.mine{background:var(--yellow); color:#111; border-color:transparent}
#unoBtn{background:linear-gradient(180deg,#ff6b62,#d8342f); color:#fff; box-shadow:0 6px 0 #8e1f1c}
#unoBtn.called{background:linear-gradient(180deg,#5fd07a,#2e9e4f); box-shadow:0 6px 0 #1d6b35; opacity:1}
#unoBtn.called::after{content:" \2713"}
#log{max-height:34vh; overflow:auto; padding:.7rem .85rem;
  background:#0b1220cc; border:1px solid var(--line); border-radius:14px; backdrop-filter:blur(6px);
  font-size:.8rem; color:var(--muted); text-align:left; line-height:1.65; white-space:pre-line;
  scrollbar-width:thin; z-index:5}
#log::before{content:"REGISTRO"; display:block; font:800 .65rem Outfit,sans-serif; letter-spacing:.16em;
  color:var(--yellow); margin-bottom:.35rem}
#side{position:fixed; top:50%; right:clamp(.6rem,2vw,1.4rem); transform:translateY(-50%);
  width:min(250px,24vw); display:flex; flex-direction:column; gap:.5rem; z-index:5}
#chat{display:flex; flex-direction:column; gap:.4rem; padding:.7rem .85rem; border-radius:14px;
  background:#0b1220cc; border:1px solid var(--line); backdrop-filter:blur(6px)}
#chatlog{max-height:26vh; overflow:auto; font-size:.8rem; line-height:1.5; scrollbar-width:thin;
  display:flex; flex-direction:column; gap:.2rem}
#chatlog b{color:var(--yellow); font-weight:700}
#chatlog .mine b{color:var(--green)}
#chatform{display:flex; gap:.35rem}
#chatform input{margin:0; padding:.4rem .55rem; font-size:.8rem; border-radius:9px}
#chatform button{padding:.4rem .6rem; font-size:.8rem; border-radius:9px; box-shadow:0 3px 0 #b8860b}
.seat .stackhit{position:absolute; top:-11px; left:-11px; background:var(--red); color:#fff;
  font:800 .72rem Outfit,sans-serif; padding:.15rem .45rem; border-radius:999px;
  box-shadow:0 0 0 2px #0b1220; animation:pulse .8s infinite}
#stackChip{background:var(--red); color:#fff; border-color:transparent; font-weight:800}
#unoBtn.armed{animation:pulse .55s infinite}
.seat .catch{position:absolute; inset:auto -6px -14px auto; padding:.15rem .5rem; border-radius:999px;
  font:800 .68rem Outfit,sans-serif; background:var(--red); color:#fff; box-shadow:0 3px 0 #8e1f1c;
  animation:pulse .6s infinite; opacity:1}
#banner{position:fixed; top:18%; left:50%; transform:translateX(-50%); z-index:30; pointer-events:none;
  display:none; padding:.9rem 1.6rem; border-radius:18px; text-align:center;
  background:#0b1220ee; border:2px solid var(--red); box-shadow:0 18px 50px #000a;
  font:800 1.5rem Outfit,sans-serif; color:#fff; max-width:min(90vw,620px)}
#banner.show{display:block; animation:bannerIn 2.6s ease both}
#banner .icon{display:block; font-size:2.2rem; line-height:1.1}
@keyframes bannerIn{0%{opacity:0; transform:translateX(-50%) scale(.6) rotate(-6deg)}
  12%{opacity:1; transform:translateX(-50%) scale(1.12)}
  20%{transform:translateX(-50%) scale(1)}
  80%{opacity:1; transform:translateX(-50%) scale(1)}
  100%{opacity:0; transform:translateX(-50%) translateY(-24px) scale(.95)}}

@media (max-width:1000px){                             /* no room for a side rail: back into the flow */
  #side{position:static; transform:none; width:auto}
  #log{max-height:88px; text-align:center}
  #chatlog{max-height:110px}
}

/* color picker + winner */
.overlay{position:fixed; inset:0; background:#03110dcc; backdrop-filter:blur(5px);
  display:none; place-items:center; z-index:20; animation:pop .2s ease both}
.overlay.show{display:grid}
.swatches{display:grid; grid-template-columns:repeat(2,88px); gap:14px; margin-top:1rem}
.sw{width:88px; height:88px; border-radius:18px; cursor:pointer; border:4px solid #fff3; transition:transform .12s}
.sw:hover{transform:scale(1.08) rotate(3deg)}
#winner h2{font-family:Bungee,sans-serif; font-size:2.4rem; margin:.2rem 0 1rem}

@keyframes deal{from{opacity:0; transform:translateY(60px) rotate(9deg) scale(.85)}}
/* a drawn card flies out of the deck into its slot in the hand */
@keyframes drawn{
  0%{opacity:0; transform:translate(var(--dx),var(--dy)) rotate(-90deg) scale(.55)}
  12%{opacity:1}
  55%{transform:translate(calc(var(--dx) * .35), calc(var(--dy) * .35 - 42px)) rotate(-40deg) scale(.9)}
  82%{transform:translate(0,-10px) rotate(4deg) scale(1.1)}
  100%{transform:none}}
/* the ring stays after the flight so you can still tell which card just arrived */
@keyframes justdrawn{0%,70%{box-shadow:0 0 0 4px var(--yellow), 0 0 26px 6px #f2c31a99}
  100%{box-shadow:0 0 0 0 #f2c31a00, 0 0 0 0 #f2c31a00}}
@keyframes kick{25%{transform:translateY(-14px) rotate(-6deg) scale(1.07)}
  60%{transform:translateY(3px) rotate(2deg) scale(.97)}}
/* MSN nudge */
@keyframes nudge{0%,100%{transform:translate(0,0)}
  10%{transform:translate(-9px,5px)} 25%{transform:translate(8px,-6px)}
  40%{transform:translate(-7px,-4px)} 55%{transform:translate(6px,6px)}
  70%{transform:translate(-4px,3px)} 85%{transform:translate(3px,-2px)}}
body.nudged{animation:nudge .55s ease}
.seat .zap{position:absolute; bottom:-9px; right:-9px; width:22px; height:22px; padding:0; font-size:.75rem;
  line-height:22px; border-radius:50%; background:#1b2534; color:var(--yellow); box-shadow:0 3px 0 #0d131d;
  opacity:0; transition:opacity .15s}
.seat:hover .zap, .seat .zap:focus-visible{opacity:1}
.seat .zap:disabled{opacity:.25}
/* emotes */
.emotebar{display:flex; gap:.35rem; justify-content:center; flex-wrap:wrap}
.emotebar button{font-size:1.15rem; line-height:1; padding:.3rem .45rem; border-radius:10px;
  background:#0b1220bb; border:1px solid var(--line); color:inherit; box-shadow:none}
.emotebar button:hover{transform:translateY(-3px); background:#16203099}
.bubble{position:fixed; left:50%; top:44%; translate:-50% -50%; pointer-events:none; z-index:40;
  display:grid; justify-items:center; gap:.4rem; animation:emote 1.6s cubic-bezier(.2,1.4,.4,1) forwards}
.bubble.penalty .face{font-family:Bungee,sans-serif; color:var(--red)}
.bubble .face{font-size:clamp(5rem,18vw,11rem); line-height:1;
  filter:drop-shadow(0 12px 26px #000a); animation:emoteshake .5s ease-in-out .18s 2}
.bubble .who{font-size:.9rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
  background:#0b1220cc; border:1px solid var(--line); border-radius:99px; padding:.25rem .7rem}
@keyframes emote{0%{opacity:0; scale:.35; rotate:-12deg}
  22%{opacity:1; scale:1.15; rotate:3deg}
  35%{scale:1; rotate:0deg}
  72%{opacity:1; scale:1}
  100%{opacity:0; scale:.8; translate:-50% -110%}}
@keyframes emoteshake{0%,100%{rotate:0deg}25%{rotate:9deg}75%{rotate:-9deg}}
#hand .card.dealt{animation:deal .38s ease both}
#hand .card.drawn{animation:drawn .72s cubic-bezier(.25,.8,.3,1) both,
  justdrawn 1.5s ease-out .72s both; z-index:6}
.deck.dealing{animation:kick .45s ease}
@keyframes slam{from{opacity:0; transform:translateY(-90px) rotate(-16deg) scale(1.3)}}
@keyframes pop{from{opacity:0; transform:scale(.96)}}
@keyframes pulse{50%{transform:scale(1.16)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important; transition:none!important}}
</style>
</head>
<body>

<div id="lobby">
  <h1>UNO<span style="color:var(--yellow)">·</span>ONLINE</h1>
  <p style="color:var(--muted);margin:.4rem 0 1.4rem">2 a 12 jugadores. Pasá el código de sala.</p>
  <div class="panel">
    <label for="name">Tu nombre</label>
    <input id="name" maxlength="16" placeholder="Nahuel" autocomplete="off" spellcheck="false" autofocus>
    <label for="room">Código de sala</label>
    <input id="room" maxlength="6" placeholder="MAIN" autocomplete="off" spellcheck="false" style="text-transform:uppercase">
    <button id="joinBtn">Entrar a la mesa</button>
    <p id="err" style="color:var(--red);min-height:1.2em;margin:.7rem 0 0;font-size:.9rem"></p>
  </div>
</div>

<div id="game">
  <div class="topbar">
    <h1>UNO</h1>
    <span class="chip">Sala <b id="codeChip">—</b></span>
    <span class="chip" id="dirChip">↻ sentido horario</span>
    <span class="chip" id="stackChip" style="display:none"></span>
    <span style="flex:1"></span>
    <button id="shareBtn" class="ghost">Copiar link de invitación</button>
    <button id="botBtn" class="ghost" style="display:none">+ Bot</button>
    <button id="startBtn" class="ghost">Empezar partida</button>
  </div>

  <div class="center">
    <div class="felt" id="felt"></div>
    <div class="seats" id="seats"></div>
    <div class="stackzone">
      <small>Mazo</small>
      <div class="deck" id="deck">UNO</div>
    </div>
    <div class="stackzone">
      <small>Descarte</small>
      <div id="pile"></div>
      <div class="colorlight" id="colorlight"><span id="colorname">—</span></div>
    </div>
  </div>

  <div class="controls">
    <button id="unoBtn" disabled>UNO!</button>
    <span class="chip turnchip" id="turnChip">esperando…</span>
  </div>

  <div class="emotebar" id="emotebar"></div>

  <div class="handwrap"><div id="hand"></div></div>
  <div id="side">
    <div id="log"></div>
    <div id="chat">
      <div id="chatlog"></div>
      <form id="chatform" autocomplete="off">
        <input id="chatinput" maxlength="140" placeholder="Escribí algo… o /add nombre 2" aria-label="Mensaje de chat">
        <button type="submit">Enviar</button>
      </form>
    </div>
  </div>
</div>

<div id="banner" role="status" aria-live="polite"></div>

<div class="overlay" id="picker">
  <div class="panel" style="text-align:center">
    <h3 style="margin:0">Elegí un color</h3>
    <div class="swatches">
      <div class="sw" data-c="R" style="background:var(--red)"></div>
      <div class="sw" data-c="G" style="background:var(--green)"></div>
      <div class="sw" data-c="B" style="background:var(--blue)"></div>
      <div class="sw" data-c="Y" style="background:var(--yellow)"></div>
    </div>
  </div>
</div>

<div class="overlay" id="winner">
  <div class="panel" style="text-align:center">
    <h2 id="winnerName">—</h2>
    <button id="againBtn">Otra partida</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const COLORVAR = { R:"var(--red)", G:"var(--green)", B:"var(--blue)", Y:"var(--yellow)", W:"#888" };
const FACE = { wild:"W", "+4":"+4", skip:"⦸", rev:"⇄", "+2":"+2" };
const face = (c) => FACE[c.v] || c.v;

let ws, state = null, pendingIndex = null, lastTopKey = "";
let myName = "";
let lastHandSize = -1;                                 // -1 = first render: deal, do not fly from the deck

function cardEl(card, extra = "") {
  const d = document.createElement("div");
  d.className = `card ${card.c} ${extra}`;
  d.innerHTML = `<span class="corner tl">${face(card)}</span><span>${face(card)}</span><span class="corner br">${face(card)}</span>`;
  return d;
}

function connect() {
  const name = $("name").value.trim() || "jugador";
  const code = ($("room").value.trim() || "MAIN").toUpperCase();
  localStorage.setItem("uno.name", name);
  myName = name;
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`);
  ws.onopen = () => ws.send(JSON.stringify({ type: "join", name, code }));
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === "error") { $("err").textContent = msg.message; ws.close(); return; }
    if (msg.type === "nudge") return nudged(msg.from);
    if (msg.type === "emote") return showEmote(msg.from, msg.emote);
    if (msg.type === "clown")
      return showEmote(msg.who, "🤡", `comió ${msg.cards} carta${msg.cards === 1 ? "" : "s"} de regalo`);
    if (msg.type === "ate") return showEmote(msg.who, `+${msg.cards}`, `se comió ${msg.cards === 1 ? "1 carta" : msg.cards + " cartas"} del ${msg.kind}`);
    if (msg.type === "chat") return addChat(msg.from, msg.text);
    if (msg.type === "announce") return banner(msg.text, msg.icon);
    if (msg.type === "state") { state = msg; $("lobby").style.display = "none"; $("game").style.display = "flex"; render(); }
  };
  ws.onclose = () => { $("turnChip").textContent = "desconectado"; };
}
const send = (o) => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));

const EMOTES = ["\u{1F602}", "\u{1F621}", "\u{1F62D}", "\u{1F60E}", "\u{1F44F}", "\u{1F480}", "\u{1F914}", "\u{1F525}"];
$("emotebar").replaceChildren(...EMOTES.map((e) => {
  const b = document.createElement("button");
  b.textContent = e;
  b.setAttribute("aria-label", `Mandar ${e}`);
  b.onclick = () => send({ type: "emote", emote: e });
  return b;
}));

/** Emotes are transient: one big centered pop with the sender's name, never in the log. */
function showEmote(playerId, emote, note) {
  const who = state?.players.find((p) => p.id === playerId);
  const b = document.createElement("div");
  b.className = note ? "bubble penalty" : "bubble";                              // on body, so a re-render of the seats cannot kill it
  const face = document.createElement("span");
  face.className = "face";
  face.textContent = emote;
  const name = document.createElement("span");
  name.className = "who";
  name.textContent = note ? `${who ? who.name : ""} ${note}` : (who ? who.name : "");
  b.append(face, name);
  b.addEventListener("animationend", (e) => { if (e.target === b) b.remove(); });
  document.body.append(b);
}

function banner(text, icon = "") {
  const b = $("banner");
  b.replaceChildren();
  if (icon) { const i = document.createElement("span"); i.className = "icon"; i.textContent = icon; b.append(i); }
  b.append(document.createTextNode(text));             // server text, still rendered as text
  b.classList.remove("show");
  void b.offsetWidth;                                  // restart the animation on back-to-back banners
  b.classList.add("show");
  clearTimeout(banner.t);
  banner.t = setTimeout(() => b.classList.remove("show"), 2600);
}

function addChat(from, text) {
  const box = $("chatlog");
  const line = document.createElement("div");
  if (from === myName) line.className = "mine";
  const who = document.createElement("b");
  who.textContent = `${from}: `;
  line.append(who, document.createTextNode(text));     // text node, never innerHTML
  box.append(line);
  while (box.children.length > 50) box.firstChild.remove();
  box.scrollTop = box.scrollHeight;
}

$("chatform").onsubmit = (e) => {
  e.preventDefault();
  const text = $("chatinput").value.trim();
  if (!text) return;
  send({ type: "chat", text });
  $("chatinput").value = "";
};

function nudged(from) {
  $("turnChip").textContent = `¡${from} te tocó timbre!`;
  document.body.classList.remove("nudged");
  void document.body.offsetWidth;                      // restart the shake on repeat nudges
  document.body.classList.add("nudged");
  setTimeout(() => document.body.classList.remove("nudged"), 600);
  try {                                                // ponytail: two oscillators beat shipping an audio file
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "square";
    o.frequency.setValueAtTime(660, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(220, ac.currentTime + 0.35);
    g.gain.setValueAtTime(0.07, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.4);
    o.connect(g).connect(ac.destination);
    o.start(); o.stop(ac.currentTime + 0.4);
    o.onended = () => ac.close();
  } catch { /* audio is optional */ }
}

let notified = false;
// ponytail: only fires on the rising edge of your turn, and only when the tab is hidden
function notifyTurn(yourTurn) {
  if (!yourTurn) { notified = false; return; }
  if (notified || document.visibilityState === "visible") return;
  notified = true;
  if (window.Notification?.permission === "granted")
    new Notification("UNO", { body: "¡Es tu turno!", tag: "uno-turn" });
}

function render() {
  const s = state;
  $("codeChip").textContent = s.code;
  $("dirChip").textContent = s.direction > 0 ? "↻ sentido horario" : "↺ sentido antihorario";
  $("stackChip").style.display = s.pendingKind ? "" : "none";
  $("stackChip").textContent = s.pendingKind
    ? `⚡ ${s.players[s.turn].name} levanta ${s.pendingCards} si no encima un ${s.pendingKind}`
    : "";
  $("botBtn").style.display = s.started || s.code !== "TEST" ? "none" : "";
  $("botBtn").disabled = s.players.length >= 12;
  $("startBtn").style.display = s.started ? "none" : "";
  $("startBtn").disabled = s.players.length < 2;

  const seats = $("seats");
  seats.classList.toggle("lobby", !s.started);
  $("felt").style.display = s.started ? "" : "none";
  const n = s.players.length;
  const mine = Math.max(0, s.players.findIndex((p) => p.id === s.you));
  const nextTurn = s.started && !s.winner ? (s.turn + (s.direction > 0 ? 1 : n - 1)) % n : -1;
  seats.replaceChildren(...s.players.map((p, i) => {
    const seat = document.createElement("div");
    const rel = (i - mine + n) % n;                     // you always sit at the bottom of the table
    const turnsAway = s.started && !s.winner
      ? (s.direction > 0 ? (i - s.turn + n) % n : (s.turn - i + n) % n) : rel;
    const a = (90 + s.direction * rel * (360 / n)) * Math.PI / 180;   // seats follow the play direction
    seat.style.setProperty("--x", (Math.cos(a) * 50).toFixed(2));
    seat.style.setProperty("--y", (Math.sin(a) * 50).toFixed(2));
    seat.className = `seat ${s.started && i === s.turn && !s.winner ? "active" : ""} ${p.id === s.you ? "me" : ""} ${i === nextTurn ? "next" : ""}`;
    seat.dataset.id = p.id;
    if (s.unoWindow?.id === p.id && p.id !== s.you && p.cards === 1 && !p.uno) {
      const c = document.createElement("button");
      c.className = "catch";
      c.textContent = "\u00A1SE LA PONGO!";
      c.title = `${p.name} no cantó UNO`;
      c.onclick = () => send({ type: "catch", target: p.id });
      seat.append(c);
    }
    if (s.pendingKind && i === s.turn && !s.winner) {  // the stack lands here unless they answer it
      const hit = document.createElement("span");
      hit.className = "stackhit";
      hit.textContent = `+${s.pendingCards}`;
      hit.title = `Levanta ${s.pendingCards} si no responde con un +2 o +4`;
      seat.append(hit);
    }
    const order = document.createElement("span");
    order.className = "order";
    order.textContent = turnsAway === 0 ? "\u25B6" : turnsAway;
    order.title = turnsAway === 0 ? "juega ahora" : `faltan ${turnsAway} turnos`;
    seat.append(order);
    if (p.uno) {
      const uno = document.createElement("span");
      uno.className = "uno";
      uno.textContent = "UNO";
      seat.append(uno);
    }
    if (p.id !== s.you) {
      const zap = document.createElement("button");
      zap.className = "zap";
      zap.textContent = "\u26a1";
      zap.title = `Tocarle timbre a ${p.name}`;
      zap.setAttribute("aria-label", `Tocarle timbre a ${p.name}`);
      zap.onclick = () => send({ type: "nudge", to: p.id });
      seat.append(zap);
    }
    const name = document.createElement("b");
    name.textContent = p.name;
    const cards = document.createElement("small");
    cards.textContent = s.started ? `${p.cards} cartas` : "listo";
    seat.append(name, cards);
    return seat;
  }));

  const pile = $("pile");
  if (s.top) {
    const key = s.top.c + s.top.v + (s.lastPlay ? s.lastPlay.at : "");
    if (key !== lastTopKey) {
      lastTopKey = key;
      const el = cardEl(s.top, "fresh");
      el.style.transform = `rotate(${(Math.random() * 16 - 8).toFixed(1)}deg)`;
      pile.append(el);                                   // newest card sits on top of the stack
      while (pile.children.length > 4) pile.firstChild.remove();
    }
  } else pile.innerHTML = "";
  $("colorlight").style.background = COLORVAR[s.color] || "#333";
  $("colorname").textContent = { R:"ROJO", G:"VERDE", B:"AZUL", Y:"AMARILLO" }[s.color] || "—";

  const hasLegalCard = s.canPlay.some(Boolean);
  const myTurn = hasLegalCard || (s.started && !s.winner && s.players[s.turn]?.id === s.you);
  $("hand").className = myTurn ? "mine" : "waiting";
  $("hand").innerHTML = "";
  const firstRender = lastHandSize < 0;
  const drawnFrom = s.hand.length > lastHandSize ? lastHandSize : s.hand.length;  // drawn cards are appended
  const fresh = [];
  s.hand.forEach((c, i) => {
    const isNew = !firstRender && i >= drawnFrom;
    const el = cardEl(c, s.canPlay[i] ? "" : "dead");
    el.classList.add(isNew ? "drawn" : "dealt");
    el.style.animationDelay = `${isNew ? (i - drawnFrom) * 90 : Math.min(i * 25, 400)}ms`;
    el.onclick = () => { if (!s.canPlay[i]) return; if (c.c === "W") { pendingIndex = i; $("picker").classList.add("show"); } else send({ type: "play", index: i }); };
    $("hand").appendChild(el);
    if (isNew) fresh.push(el);
  });
  if (fresh.length) {
    const d = $("deck").getBoundingClientRect();
    for (const el of fresh) {                          // aim each new card back at the deck it came from
      const r = el.getBoundingClientRect();
      el.style.setProperty("--dx", `${d.left - r.left}px`);
      el.style.setProperty("--dy", `${d.top - r.top}px`);
    }
    $("deck").classList.remove("dealing");
    void $("deck").offsetWidth;                        // restart the kick even on consecutive draws
    $("deck").classList.add("dealing");
  }
  lastHandSize = s.hand.length;

  const called = s.players.some((p) => p.id === s.you && p.uno);
  const unoBtn = $("unoBtn");
  unoBtn.classList.toggle("called", called);
  unoBtn.textContent = called ? "UNO" : "UNO!";
  // Armed either while holding two cards, or during the grace window right after dumping the second-to-last.
  const inGraceWindow = s.unoWindow?.id === s.you && s.hand.length === 1;
  unoBtn.disabled = called || !(inGraceWindow || (myTurn && s.hand.length === 2 && s.canPlay.some(Boolean)));
  unoBtn.classList.toggle("armed", inGraceWindow && !called);
  const canDraw = myTurn && !s.pendingKind && !hasLegalCard;
  $("deck").style.pointerEvents = canDraw ? "auto" : "none";
  $("deck").classList.toggle("disabled", !canDraw);
  $("deck").classList.toggle("mustdraw", canDraw);     // no legal card: the deck is the only move
  const yourTurn = s.started && !s.winner && s.players[s.turn]?.id === s.you;
  notifyTurn(yourTurn);
  $("turnChip").classList.toggle("mine", yourTurn);
  $("turnChip").textContent = !s.started ? "esperando jugadores…"
    : s.winner ? "se terminó" : canDraw ? "\u25B6 NO TENÉS JUGADA \u2014 LEVANTÁ DEL MAZO"
    : yourTurn ? "\u25B6 TU TURNO" : `\u23F3 turno de ${s.players[s.turn]?.name}`;
  $("log").textContent = s.log.slice(-8).join("\n");

  if (s.winner) { $("winnerName").textContent = `¡Ganó ${s.winner}! 🎉`; $("winner").classList.add("show"); }
  else $("winner").classList.remove("show");
}

$("shareBtn").onclick = async () => {
  const link = `${location.origin}/?room=${state ? state.code : "MAIN"}`;
  try { await navigator.clipboard.writeText(link); } catch { prompt("Copiá este link:", link); }
  $("shareBtn").textContent = "¡Copiado!";
  setTimeout(() => ($("shareBtn").textContent = "Copiar link de invitación"), 1400);
};
$("joinBtn").onclick = () => { window.Notification?.requestPermission?.(); connect(); };
$("room").onkeydown = $("name").onkeydown = (e) => { if (e.key === "Enter") connect(); };
$("botBtn").onclick = () => send({ type: "addBot" });
$("startBtn").onclick = () => send({ type: "start" });
$("againBtn").onclick = () => { $("winner").classList.remove("show"); send({ type: "start" }); };
$("deck").onclick = () => send({ type: "draw" });
$("unoBtn").onclick = () => send({ type: "uno" });
$("picker").onclick = (e) => {
  const sw = e.target.closest(".sw");
  if (!sw) return;
  send({ type: "play", index: pendingIndex, color: sw.dataset.c });
  $("picker").classList.remove("show");
};
$("name").value = localStorage.getItem("uno.name") || "";
$("room").value = new URLSearchParams(location.search).get("room") || "";
</script>
</body>
</html>
